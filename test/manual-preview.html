<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carve manual preview fixture</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2a3a; color: #ddd; font-family: sans-serif; }
    #status { position: absolute; z-index: 4; top: 8px; left: 8px; right: 8px; padding: 4px 10px;
              background: rgba(0,0,0,0.65); border-radius: 4px; pointer-events: none; }
    #viewer { width: 100vw; height: 100vh; display: block; }
    #viewer2d { position: relative; width: 100vw; height: 100vh; overflow: hidden;
                background: #f7f7f7; cursor: grab; touch-action: none; user-select: none; }
    #viewer2d.panning { cursor: grabbing; }
    #viewer2dGrid, #svgPreview { position: absolute; left: 0; top: 0; }
    #viewer2dGrid { width: 100%; height: 100%; pointer-events: none; }
    #svgPreview { display: block; max-width: none; max-height: none;
                  transform-origin: 0 0; pointer-events: none; user-select: none; }
    #fit2d { position: absolute; z-index: 3; right: 10px; bottom: 10px; }
    [hidden] { display: none !important; }
    #status.error { background: rgba(150,30,30,0.75); }
  </style>
</head>
<body>
  <canvas id="viewer"></canvas>
  <div id="viewer2d" hidden>
    <canvas id="viewer2dGrid"></canvas>
    <img id="svgPreview" alt="OpenSCAD 2D preview" draggable="false" />
    <button id="fit2d" type="button">Fit</button>
  </div>
  <div id="status">Loading OpenSCAD WebAssembly…</div>
  <script>
    const twoDimensionalFixture = `
      $fn = 32;
      difference() {
        circle(25);
        circle(12.5);
        translate([0, 15.375]) square([1.5, 7.06], center = true);
      }
    `;
    let renderRequested = false;
    window.renderScad = (code) => window.postMessage({ type: 'render', code });
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        window.lastCarveMessage = message;
        if (message.type === 'ready' && !renderRequested) {
          renderRequested = true;
          queueMicrotask(() => window.renderScad(twoDimensionalFixture));
        }
      }
    });
  </script>
  <script type="importmap">
  {
    "imports": {
      "openscad": "../media/openscad.js",
      "openscad-wasm": "../media/openscad.wasm",
      "three": "../media/three.module.js",
      "three/addons/controls/OrbitControls.js": "../media/OrbitControls.js",
      "three/addons/loaders/STLLoader.js": "../media/STLLoader.js"
    }
  }
  </script>
  <script type="module" src="../media/viewer.js"></script>
</body>
</html>
